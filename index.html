<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetTools</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" aria-label="Menu">&#9776;</button>
    <h1>NetTools</h1>
    <button id="themeBtn">Toggle theme</button>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <button class="nav-btn active" data-target="url">URL Anatomy</button>
      <button class="nav-btn" data-target="ip">IP Info</button>
      <button class="nav-btn" data-target="dns">DNS Lookup</button>
      <button class="nav-btn" data-target="subnet">Subnet / CIDR</button>
    </nav>

    <main class="content">
      <section id="url" class="tool active">
        <h2>URL Anatomy Visualizer</h2>
        <p>Paste a URL to see its parts explained.</p>
        <form id="urlForm" class="tool-form">
          <input type="text" id="urlInput" placeholder="https://example.com:8080/blog/post?id=5#top" required>
          <button type="submit">Analyze</button>
        </form>
        <p id="urlError" class="error" role="alert"></p>
        <div id="urlResult"></div>
      </section>
      <section id="ip" class="tool"><h2>IP Info Lookup</h2><p>Coming soon (Week 3).</p></section>
      <section id="dns" class="tool"><h2>DNS Lookup</h2><p>Coming soon (Week 4).</p></section>
      <section id="subnet" class="tool"><h2>Subnet / CIDR Calculator</h2><p>Coming soon (Week 5).</p></section>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
